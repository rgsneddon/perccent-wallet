name: perccent_wallet
description: Standalone Perccent wallet — send, receive, stake, and sync on the Chronoflux Principia chain.
publish_to: 'none'
version: 1.1.5+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  pdf: ^3.11.3
  file_selector: ^1.0.4
  path_provider: ^2.1.5
  flutter_web_auth_2: ^5.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.3
  window_manager: ^0.5.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

# path_provider_android 2.3.x uses JNI-only registration; pin 2.2.19 so the
# native PathProviderPlugin is registered (matches evolve_app / avoids cold-start JNI crash).
dependency_overrides:
  path_provider_android: 2.2.19
  flutter_secure_storage_windows:
    path: stubs/flutter_secure_storage_windows

flutter:
  uses-material-design: true
  assets:
    - assets/branding/my_perc_logo.png
    - assets/banner/evolve.jpg
    - assets/data/outcome_registry.json
    - assets/config/perc_network.json
    - assets/flags/gb.png
    - assets/flags/us.png
    - assets/flags/eu.png
    - LICENSE